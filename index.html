function parseRecipeText(text,source=''){let t=text.replace(/\r/g,'').trim(),lines=t.split('\n').map(s=>s.trim()).filter(Boolean);let ingredientStart=lines.findIndex(s=>/^(ingredients|sastojci|you will need|what you need)\s*:?$/i.test(s));let methodStart=lines.findIndex(s=>/^(instructions|directions|method|preparation|steps|priprema|postupak)\s*:?$/i.test(s));let title=lines.find(s=>!/^https?:|^#|^@/.test(s))||'Imported recipe';let ingredients='',instructions='';if(ingredientStart>=0){ingredients=lines.slice(ingredientStart+1,methodStart>ingredientStart?methodStart:undefined).join('\n')}if(methodStart>=0){instructions=lines.slice(methodStart+1).join('\n')}if(ingredientStart<0&&methodStart<0){instructions=t}return {...blank(),title:title.slice(0,120),ingredients,instructions,source,notes:'Imported from shared text. Check ingredients and steps before saving.'}}
function extractJsonLdRecipe(data,source){let nodes=[];function walk(x){if(!x||typeof x!=='object')return;if(Array.isArray(x)){x.forEach(walk);return}if(x['@type']&&(Array.isArray(x['@type'])?x['@type'].includes('Recipe'):String(x['@type']).toLowerCase()==='recipe'))nodes.push(x);if(x['@graph'])walk(x['@graph'])}walk(data);let r=nodes[0];if(!r)return null;let steps=r.recipeInstructions||[];let instructions=Array.isArray(steps)?steps.map(s=>typeof s==='string'?s:(s.text||s.name||'')).filter(Boolean).join('\n'):typeof steps==='string'?steps:'';return {...blank(),title:r.name||'Imported recipe',ingredients:Array.isArray(r.recipeIngredient)?r.recipeIngredient.join('\n'):'',instructions,source,servings:Array.isArray(r.recipeYield)?r.recipeYield.join(', '):(r.recipeYield||''),notes:'Imported from website structured data. Please review.'}}
function importScreen(){view='import';page='import';app.innerHTML='<div class="panel import-form"><p class="tag">SAVE RECIPES FROM ANYWHERE</p><h1>Import a Recipe</h1><p>Paste a recipe, or a link from a recipe website, TikTok, Instagram or YouTube.</p><label class="field">Recipe link (optional)<input id="importUrl" type="url" placeholder="https://..."></label><label class="field">Recipe text or video caption<textarea id="importText" placeholder="Paste the caption, ingredients or full recipe here..."></textarea></label><p class="import-notice">Websites with Recipe structured data may import automatically. Social media links usually do not expose captions or video speech to this web app; paste the caption if available. We never invent missing ingredients.</p><div class="actions"><button class="primary" id="analyze">Prepare recipe</button><button id="importBack">Cancel</button></div><div id="importResult"></div></div>';document.getElementById('importBack').onclick=()=>{view='recipes';home()};document.getElementById('analyze').onclick=async()=>{let url=document.getElementById('importUrl').value.trim(),text=document.getElementById('importText').value.trim(),out=document.getElementById('importResult');if(!url&&!text){alert('Paste a link or recipe text.');return}if(url){try{let u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw Error('Invalid link')}catch{alert('Please enter a valid website link.');return}}let parsed=text?parseRecipeText(text,url):null;if(!parsed&&url){out.textContent='Checking whether the website allows recipe extraction...';try{let response=await fetch(url,{mode:'cors',signal:AbortSignal.timeout(7000)});if(!response.ok)throw Error('Blocked');let html=await response.text();let doc=new DOMParser().parseFromString(html,'text/html');for(let script of doc.querySelectorAll('script[type="application/ld+json"]')){try{parsed=extractJsonLdRecipe(JSON.parse(script.textContent),url);if(parsed)break}catch{}}}catch{}if(!parsed){parsed={...blank(),title:'Recipe from '+new URL(url).hostname,source:url,notes:'Only the link was available. Paste the recipe caption or ingredients to complete it.'}}}importDraft=parsed;out.innerHTML='<div class="import-preview"><h3>Review before saving</h3><p><strong>'+esc(parsed.title)+'</strong></p><p class="muted">Ingredients: '+(parsed.ingredients?parsed.ingredients.split('\n').length+' lines':'not found')+' · Instructions: '+(parsed.instructions?'found':'not found')+'</p><p class="muted">You can edit every field before saving.</p><button class="primary" id="review">Review & edit recipe</button></div>';document.getElementById('review').onclick=()=>{current=importDraft;page='edit';render()}};nav()}
const originalDecorate=decorate;decorate=function(){originalDecorate();if(page==='home'&&(view==='recipes'||view==='favorites')){let hero=app.querySelector('.hero');if(hero&&view==='recipes'){let b=document.createElement('div');b.className='import-launch';b.innerHTML='<h3>↗ Save a recipe from anywhere</h3><p>Import from a recipe website, or paste a TikTok / Instagram caption.</p><button class="primary" id="openImport">Import a recipe</button>';hero.after(b);document.getElementById('openImport').onclick=importScreen}}if(page==='import')importScreen()};
const prevNav=nav;nav=function(){prevNav();let add=document.querySelector('[data-nav="add"]');if(add){add.title='Add a recipe manually';}let navEl=document.getElementById('heritage-nav');if(navEl&&!navEl.querySelector('[data-nav="import"]')){let b=document.createElement('button');b.dataset.nav='import';b.textContent='↗ Import';b.onclick=importScreen;navEl.insertBefore(b,navEl.querySelector('[data-nav="settings"]'))}};
window.addEventListener('DOMContentLoaded',()=>{if(location.search.includes('url=')){let url=new URLSearchParams(location.search).get('url');importScreen();document.getElementById('importUrl').value=url||''}});
render();

if(!texts.length){status.textContent='No readable text found. This video may only contain spoken instructions.';return}

}catch(e){status.textContent='Video scanning failed: '+e.message}finally{if(worker)await worker.terminate();busy=false;btn.disabled=false}};
