<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f2e9"><title>My Recipes | Personal Cookbook</title><style>

:root{--accent:#b66d53;--paper:#faf6ef;--ink:#392d29;--line:#e9d9c8}body{background:var(--paper);color:var(--ink)}header{background:var(--paper);border-color:var(--line)}header strong{color:var(--accent);font-style:italic}header small{color:#8c786d}.hero{background:#f1e4d6;border:1px solid var(--line);position:relative}.hero:after{content:'✿';position:absolute;right:35px;top:28px;font-size:80px;color:#d9baa6;opacity:.45}.hero h1{font-style:italic;color:var(--ink)}.primary{background:var(--accent);border-color:var(--accent)}.tag{color:var(--accent)}.card{border-color:var(--line);box-shadow:0 4px 16px #392d290b}.cover{background:#f0e5d8}.panel{border-color:var(--line)}button:hover,.card:hover{filter:brightness(.97)}.nav{display:flex;justify-content:space-around;align-items:center;position:sticky;bottom:0;z-index:4;background:#faf6efee;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:9px 8px}.nav button{border:0;background:transparent;font-size:13px}.nav button.active{color:var(--accent)}.nav button.add{background:var(--accent);color:#fff;border-radius:50%;width:49px;height:49px;font-size:26px;padding:0}.mini{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 18px}.mini button{font-size:12px;padding:9px 12px}.mini .selected{background:var(--accent);color:white}.checkline{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:9px 0}.checkline input{width:auto;accent-color:var(--accent)}.checkline:has(input:checked) span{text-decoration:line-through;opacity:.5}.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.step b{color:var(--accent)}.settings-colors{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.swatch{height:37px;width:37px;border-radius:50%;border:2px solid #ffffff;box-shadow:0 0 0 1px #c6b6a7;padding:0}.swatch.on{box-shadow:0 0 0 3px var(--ink)}.tabs{display:flex;gap:7px;margin:20px 0}.tabs button.active{background:var(--accent);color:white}.subheading{font-style:italic}.cookbar{position:sticky;top:0;z-index:8;background:var(--accent);color:white;padding:12px 16px;border-radius:12px;display:flex;align-items:center;justify-content:space-between}.cookbar button{color:var(--accent)}.card h3{font-size:18px}.row>*{min-width:0}@media(min-width:800px){.nav{max-width:1080px;margin:auto;border:1px solid var(--line);border-radius:16px}.hero{padding:45px}}
</style></head><body><header><strong>✿ my recipes</strong><small>YOUR PERSONAL COOKBOOK</small></header><main id="app"></main><footer>Made with love · My Recipes</footer><script>
const KEY='my-recipes-v1',cats=['Breakfast','Lunch','Dinner','Desserts','Snacks','Drinks','Other'];let recipes=[];try{recipes=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(recipes))recipes=[]}catch{}let page='home',current=null,search='',cat='All',favs=false;const app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(KEY,JSON.stringify(recipes))}catch{alert('Storage is full. Export a backup and reduce photo sizes.')}}function blank(){return{id:crypto.randomUUID(),title:'',category:'Dinner',ingredients:'',instructions:'',notes:'',source:'',time:'',servings:'',photos:[],favorite:false,created:Date.now()}}function home(){page='home';render()}function edit(id){current=id?structuredClone(recipes.find(r=>r.id===id)):blank();page='edit';render();scrollTo(0,0)}function detail(id){current=recipes.find(r=>r.id===id);page='detail';render();scrollTo(0,0)}function favorite(id){recipes=recipes.map(r=>r.id===id?{...r,favorite:!r.favorite}:r);persist();if(page==='detail')detail(id);else render()}function removeRecipe(id){if(confirm('Delete this recipe permanently?')){recipes=recipes.filter(r=>r.id!==id);persist();home()}}function backup(){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({app:'My Recipes',version:1,recipes},null,2)],{type:'application/json'}));a.href=url;a.download='my-recipes-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}async function restore(f){if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.recipes)||!d.recipes.every(r=>typeof r.id==='string'&&typeof r.title==='string'&&Array.isArray(r.photos)))throw Error();if(confirm('Import '+d.recipes.length+' recipes?')){let ids=new Set(d.recipes.map(r=>r.id));recipes=[...d.recipes,...recipes.filter(r=>!ids.has(r.id))];persist();home()}}catch{alert('Invalid My Recipes backup file.')}}function render(){if(page==='home'){let list=recipes.filter(r=>(!favs||r.favorite)&&(cat==='All'||r.category===cat)&&[r.title,r.ingredients,r.notes].join(' ').toLowerCase().includes(search.toLowerCase()));app.innerHTML='<section class="hero"><span class="tag">YOUR KITCHEN, YOUR STORIES</span><h1>Every recipe has a story.</h1><p>A beautiful little home for all the dishes you love. Save, organize, and make them your own.</p><button class="primary" id="add">+ Add a recipe</button></section><h2>My cookbook <span class="muted">('+recipes.length+')</span></h2><div class="toolbar"><input id="search" placeholder="Search recipes or ingredients..." value="'+esc(search)+'"><select id="cat"><option>All</option>'+[...new Set([...cats,...recipes.map(r=>r.category)])].map(c=>'<option '+(cat===c?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select><button id="favs">'+(favs?'♥ Favorites ✓':'♡ Favorites')+'</button><button id="backup">↓ Backup</button><button id="import">↑ Import</button><input type="file" accept=".json,application/json" id="backupfile" hidden></div><div class="grid">'+list.map(r=>'<article class="card" data-id="'+esc(r.id)+'"><div class="cover">'+(r.photos?.[0]?'<img src="'+esc(r.photos[0])+'" alt="">':'♨')+'</div><div class="content"><span class="tag">'+esc(r.category)+'</span><h3>'+esc(r.title)+'</h3><span class="muted">'+esc(r.time||'')+' '+(r.favorite?'♥':'')+'</span></div></article>').join('')+'</div>'+(list.length? '':'<div class="empty"><h2>Your cookbook starts here</h2><p>Add your first recipe or try a different search.</p></div>');document.getElementById('add').onclick=()=>edit();document.getElementById('search').oninput=e=>{search=e.target.value;render();document.getElementById('search').focus();document.getElementById('search').setSelectionRange(search.length,search.length)};document.getElementById('cat').onchange=e=>{cat=e.target.value;render()};document.getElementById('favs').onclick=()=>{favs=!favs;render()};document.getElementById('backup').onclick=backup;document.getElementById('import').onclick=()=>document.getElementById('backupfile').click();document.getElementById('backupfile').onchange=e=>restore(e.target.files[0]);document.querySelectorAll('.card').forEach(c=>c.onclick=()=>detail(c.dataset.id));return}if(page==='edit'){let fields=[['title','Recipe name *','input'],['category','Category','input'],['time','Preparation / cooking time','input'],['servings','Servings','input'],['ingredients','Ingredients (one per line)','textarea'],['instructions','Instructions','textarea'],['notes','Personal notes','textarea'],['source','Original recipe URL','input']];app.innerHTML='<button id="back">← Back to cookbook</button><div class="panel"><h1>'+(recipes.some(r=>r.id===current.id)?'Edit recipe':'New recipe')+'</h1>'+fields.map(([key,label,type])=>'<label class="field">'+label+(type==='textarea'?'<textarea id="f-'+key+'">'+esc(current[key])+'</textarea>':'<input id="f-'+key+'" value="'+esc(current[key])+'">')+'</label>').join('')+'<label class="field">Recipe photos (up to 12)<input id="photos" type="file" accept="image/*" multiple></label><div id="previews">'+current.photos.map((p,i)=>'<span><img class="photo" src="'+esc(p)+'"><button data-remove="'+i+'">×</button></span>').join('')+'</div><div class="actions"><button class="primary" id="save">Save recipe</button><button id="cancel">Cancel</button></div></div>';document.getElementById('back').onclick=home;document.getElementById('cancel').onclick=home;fields.forEach(([key])=>document.getElementById('f-'+key).oninput=e=>current[key]=e.target.value);document.getElementById('save').onclick=()=>{if(!current.title.trim())return alert('Please enter a recipe name.');recipes=[current,...recipes.filter(r=>r.id!==current.id)];persist();home()};document.getElementById('photos').onchange=async e=>{for(let f of [...e.target.files].slice(0,12-current.photos.length)){if(!f.type.startsWith('image/'))continue;let img=new Image(),url=URL.createObjectURL(f);await new Promise(resolve=>{img.onload=resolve;img.onerror=resolve;img.src=url});if(img.width){let canvas=document.createElement('canvas'),scale=Math.min(1,1000/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);current.photos.push(canvas.toDataURL('image/jpeg',.65))}URL.revokeObjectURL(url)}render()};document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{current.photos.splice(Number(b.dataset.remove),1);render()});return}let r=current;app.innerHTML='<button id="back">← Back to cookbook</button><div class="panel">'+(r.photos?.[0]?'<img class="detail-img" src="'+esc(r.photos[0])+'">':'')+'<p class="tag">'+esc(r.category)+'</p><h1>'+esc(r.title)+'</h1><p>'+esc(r.time)+' · '+esc(r.servings)+' servings</p><div class="actions"><button class="primary" id="edit">Edit</button><button id="fav">'+(r.favorite?'♥ Favorite':'♡ Favorite')+'</button><button class="danger" id="delete">Delete</button></div><h2>Ingredients</h2><div class="pre">'+esc(r.ingredients)+'</div><h2>Instructions</h2><div class="pre">'+esc(r.instructions)+'</div>'+(r.notes?'<h2>My notes</h2><div class="pre">'+esc(r.notes)+'</div>':'')+(r.source?'<h2>Original source</h2><p>'+(/https?:\/\//i.test(r.source)?'<a target="_blank" rel="noopener noreferrer" href="'+esc(r.source)+'">Visit original recipe</a>':esc(r.source))+'</p>':'')+r.photos.slice(1).map(p=>'<img class="photo" src="'+esc(p)+'">').join('')+'</div>';document.getElementById('back').onclick=home;document.getElementById('edit').onclick=()=>edit(r.id);document.getElementById('fav').onclick=()=>favorite(r.id);document.getElementById('delete').onclick=()=>removeRecipe(r.id)}render();
</script><script id="heritage-features">
const HKEY='my-recipes-v2-settings';let prefs={accent:'#b66d53',mode:'light',collections:[]};try{prefs={...prefs,...JSON.parse(localStorage.getItem(HKEY)||'{}')}}catch{};let view='recipes',collectionFilter='All',cook=false;function applyPrefs(){document.documentElement.style.setProperty('--accent',prefs.accent);if(prefs.mode==='dark'){document.documentElement.style.setProperty('--paper','#26211e');document.documentElement.style.setProperty('--ink','#f9f0e7');document.documentElement.style.setProperty('--line','#55433a')}else{document.documentElement.style.setProperty('--paper','#faf6ef');document.documentElement.style.setProperty('--ink','#392d29');document.documentElement.style.setProperty('--line','#e9d9c8')}}function savePrefs(){localStorage.setItem(HKEY,JSON.stringify(prefs));applyPrefs()}applyPrefs();
const oldRender=render;render=function(){oldRender();decorate()};function nav(){let el=document.getElementById('heritage-nav');if(!el){el=document.createElement('nav');el.id='heritage-nav';el.className='nav';document.querySelector('footer').before(el)}el.innerHTML='<button data-nav="recipes" class="'+(view==='recipes'?'active':'')+'">⌂ Recipes</button><button data-nav="favorites" class="'+(view==='favorites'?'active':'')+'">♡ Favorites</button><button class="add" data-nav="add">+</button><button data-nav="collections" class="'+(view==='collections'?'active':'')+'">▦ Collections</button><button data-nav="settings" class="'+(view==='settings'?'active':'')+'">⚙ Settings</button>';el.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{let n=b.dataset.nav;if(n==='add'){edit();return}view=n;page='home';favs=n==='favorites';if(n!=='recipes'&&n!=='favorites'){search='';cat='All'}render()})}
function decorate(){nav();if(page==='edit'){let panel=document.querySelector('.panel');if(panel){let label=document.createElement('label');label.className='field';label.textContent='Collections (comma separated)';let input=document.createElement('input');input.value=(current.collections||[]).join(', ');input.oninput=()=>current.collections=input.value.split(',').map(s=>s.trim()).filter(Boolean);label.append(input);panel.querySelector('.actions').before(label);let hint=document.createElement('p');hint.className='muted';hint.textContent='Paste a full recipe into Ingredients or Instructions. You can also add your own notes and photos.';panel.querySelector('h1').after(hint)}return}if(page==='detail'){let panel=document.querySelector('.panel');if(!panel)return;let headings=[...panel.querySelectorAll('h2')],ingredients=headings.find(x=>x.textContent==='Ingredients'),instructions=headings.find(x=>x.textContent==='Instructions');if(ingredients){let d=ingredients.nextElementSibling;if(d){d.innerHTML=(current.ingredients||'').split('\n').filter(Boolean).map(t=>'<label class="checkline"><input type="checkbox"><span>'+esc(t)+'</span></label>').join('')}}if(instructions){let d=instructions.nextElementSibling;if(d){d.innerHTML=(current.instructions||'').split('\n').filter(Boolean).map((t,i)=>'<div class="step"><b>'+(i+1)+'.</b><span>'+esc(t)+'</span></div>').join('')}}let b=document.createElement('button');b.className='primary';b.textContent=cook?'Exit cooking mode':'♨ Cooking mode';panel.querySelector('.actions').append(b);b.onclick=()=>{cook=!cook;if(cook){try{navigator.wakeLock?.request('screen').then(l=>window._cookLock=l).catch(()=>{})}catch{}}else{window._cookLock?.release?.()}render()};if(cook){let bar=document.createElement('div');bar.className='cookbar';bar.innerHTML='<strong>♨ Cooking mode</strong><span>Tick off ingredients as you cook</span>';panel.prepend(bar)}return}if(view==='settings'){app.innerHTML='<div class="panel"><p class="tag">MAKE IT YOURS</p><h1>Settings</h1><h2>Appearance</h2><p>Choose a color for your personal cookbook.</p><div class="settings-colors" id="swatches"></div><label class="field">Your custom color <input type="color" id="customColor" value="'+esc(prefs.accent)+'" style="height:52px;max-width:130px;padding:5px"></label><label class="field">Appearance<select id="appearance"><option value="light">Light</option><option value="dark">Dark</option></select></label><h2>Backup & Restore</h2><p>Recipes are stored on this device. Export regularly to keep a copy.</p><div class="actions"><button id="export">↓ Export backup</button><button id="import2">↑ Import backup</button><input id="file2" type="file" accept=".json,application/json" hidden></div></div>';let colors=['#b66d53','#916f59','#527c9a','#a47d9d','#c98a9b','#7a8061','#3d6266','#333333'];document.getElementById('swatches').innerHTML=colors.map(c=>'<button class="swatch '+(prefs.accent===c?'on':'')+'" data-color="'+c+'" style="background:'+c+'" aria-label="Choose '+c+'"></button>').join('');document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{prefs.accent=b.dataset.color;savePrefs();render()});document.getElementById('customColor').oninput=e=>{prefs.accent=e.target.value;savePrefs();document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('on',b.dataset.color===prefs.accent))};document.getElementById('appearance').value=prefs.mode;document.getElementById('appearance').onchange=e=>{prefs.mode=e.target.value;savePrefs()};document.getElementById('export').onclick=backup;document.getElementById('import2').onclick=()=>document.getElementById('file2').click();document.getElementById('file2').onchange=e=>restore(e.target.files[0]);return}if(view==='collections'){let names=[...new Set([...prefs.collections,...recipes.flatMap(r=>r.collections||[])])];app.innerHTML='<div class="panel"><p class="tag">YOUR PERSONAL LIBRARY</p><h1>My Collections</h1><p>Group recipes into family traditions, holidays or anything you love.</p><div class="row"><input id="newcollection" placeholder="e.g. Grandma’s Favorites"><button class="primary" id="addcollection">Add collection</button></div><div class="mini" id="collections">'+names.map(n=>'<button data-collection="'+esc(n)+'">'+esc(n)+' ('+recipes.filter(r=>(r.collections||[]).includes(n)).length+')</button>').join('')+'</div><div class="grid" id="collectionrecipes"></div></div>';document.getElementById('addcollection').onclick=()=>{let n=document.getElementById('newcollection').value.trim();if(n&&!names.includes(n)){prefs.collections.push(n);savePrefs();render()}};document.querySelectorAll('[data-collection]').forEach(b=>b.onclick=()=>{collectionFilter=b.dataset.collection;let rr=recipes.filter(r=>(r.collections||[]).includes(collectionFilter));document.getElementById('collectionrecipes').innerHTML=rr.map(r=>'<article class="card" data-open="'+esc(r.id)+'"><div class="cover">'+(r.photos?.[0]?'<img src="'+esc(r.photos[0])+'">':'♨')+'</div><div class="content"><h3>'+esc(r.title)+'</h3></div></article>').join('')||'<p>No recipes yet. Edit a recipe to add it to this collection.</p>';document.querySelectorAll('[data-open]').forEach(c=>c.onclick=()=>detail(c.dataset.open))});return}if(view==='favorites'){let h=app.querySelector('h2');if(h)h.textContent='♡ My Favorites';return}if(view==='recipes'){let h=app.querySelector('h2');if(h)h.classList.add('subheading');let bar=app.querySelector('.toolbar');if(bar){let mini=document.createElement('div');mini.className='mini';mini.innerHTML=['All','Breakfast','Lunch','Dinner','Desserts'].map(c=>'<button data-cat="'+c+'" class="'+(cat===c?'selected':'')+'">'+c+'</button>').join('');bar.after(mini);mini.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()})}}}
const oldHome=home;home=function(){view='recipes';oldHome()};const oldDetail=detail;detail=function(id){oldDetail(id)};render();
</script></body></html>
